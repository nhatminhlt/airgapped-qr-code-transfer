<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Receiver Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>
        <div class="text-sm mb-4">
          Progress: {{received}} / {{file_metadata.chunks || 0}}
          <span v-if="file_metadata.chunks">
            ({{file_metadata.chunks - received}} missing)
          </span>
        </div>
        <button
          v-if="!is_receiving"
          v-on:click="start_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Receiver
        </button>
        <button
          v-else
          v-on:click="stop_receiver"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Receiver
        </button>
        <video id="videoElement" muted autoplay playsinline></video>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, reactive, onMounted } = Vue;

      createApp({
        setup() {
          const idle_message = "Click receive button to start receiving";
          const user_message = ref(idle_message);
          const received = ref(0);
          const file_metadata = reactive({});
          const is_receiving = ref(false);
          // Plain Map (not reactive): index -> Uint8Array
          let chunks = new Map();
          let current_id = null;
          let canvas, context, videoElement;

          const b64_to_bytes = (b64) => {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
          };

          const reset_state = () => {
            chunks = new Map();
            received.value = 0;
            current_id = null;
            for (const key of Object.keys(file_metadata)) {
              delete file_metadata[key];
            }
          };

          const download_file = (data, fileName) => {
            const blob = new Blob([data]);
            const dummy_element = document.createElement("a");
            const url = URL.createObjectURL(blob);
            dummy_element.href = url;
            dummy_element.download = fileName;
            dummy_element.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
          };

          const stop_receiver = () => {
            is_receiving.value = false;
            reset_state();
            user_message.value = idle_message;
          };

          const next_frame = () =>
            new Promise((r) =>
              "requestVideoFrameCallback" in videoElement
                ? videoElement.requestVideoFrameCallback(() => r())
                : requestAnimationFrame(() => r())
            );

          const handle_symbol = (text) => {
            if (text.charAt(0) === "{") {
              const meta = JSON.parse(text);
              if (meta.id !== current_id) {
                // New transfer: reset progress. The same meta repeating
                // while looping must NOT wipe what we already have.
                chunks = new Map();
                received.value = 0;
                current_id = meta.id;
              }
              Object.assign(file_metadata, meta);
              user_message.value = `Transferring file: ${meta.name}`;
              return;
            }
            const parts = text.split("|");
            if (parts.length !== 3) return;
            const [id, index, b64] = parts;
            if (current_id === null) current_id = id;
            if (id !== current_id) return;
            const i = parseInt(index);
            if (chunks.has(i)) return;
            chunks.set(i, b64_to_bytes(b64));
            received.value = chunks.size;
          };

          const is_complete = () =>
            file_metadata.chunks && chunks.size >= file_metadata.chunks;

          const start_receiver = async () => {
            reset_state();
            is_receiving.value = true;
            user_message.value = "Point the camera at the sender's screen";
            while (is_receiving.value && !is_complete()) {
              try {
                await next_frame();
                if (
                  canvas.width !== videoElement.videoWidth ||
                  canvas.height !== videoElement.videoHeight
                ) {
                  canvas.width = videoElement.videoWidth;
                  canvas.height = videoElement.videoHeight;
                }
                if (!canvas.width) continue;
                context.drawImage(videoElement, 0, 0);
                const image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                const symbols = await zbarWasm.scanImageData(image_data);
                if (!symbols || !symbols.length) continue;
                handle_symbol(symbols[0].decode());
              } catch (error) {
                console.error("Error in Loop: ", error);
              }
            }
            if (!is_receiving.value) return;

            user_message.value = "Data Transfer Complete";
            let total = 0;
            for (let i = 0; i < file_metadata.chunks; i++) {
              total += chunks.get(i).length;
            }
            const joined = new Uint8Array(total);
            let offset = 0;
            for (let i = 0; i < file_metadata.chunks; i++) {
              joined.set(chunks.get(i), offset);
              offset += chunks.get(i).length;
            }
            const inflated = pako.inflate(joined);
            download_file(inflated, file_metadata.name);
            is_receiving.value = false;
          };

          onMounted(async () => {
            console.log("Application Initialized ...");
            videoElement = document.getElementById("videoElement");
            videoElement.srcObject = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 },
              },
            });
            canvas = document.createElement("canvas");
            context = canvas.getContext("2d", { willReadFrequently: true });
          });

          return {
            user_message,
            start_receiver,
            is_receiving,
            file_metadata,
            received,
            stop_receiver,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
