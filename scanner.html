<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="lib/tailwind.js"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-2">Data Receiver Mode</div>
        <div class="text-sm mb-2 px-2 text-center">{{user_message}}</div>
        <div class="text-sm mb-1">
          Recovered: {{solved}} / {{file_metadata.K || 0}} blocks ·
          frames caught: {{symbols}}
        </div>
        <div class="w-64 h-3 bg-gray-200 border border-gray-400 mb-3">
          <div class="h-full bg-green-500" :style="{width: percent + '%'}"></div>
        </div>
        <div class="flex flex-row gap-2 mb-3">
          <button
            v-if="!is_receiving"
            v-on:click="start_receiver"
            class="p-1 border-2 border-gray-500"
          >
            {{symbols ? 'Resume' : 'Start Receiver'}}
          </button>
          <button
            v-else
            v-on:click="stop_receiver"
            class="p-1 border-2 border-gray-500"
          >
            Pause (progress is saved)
          </button>
          <button
            v-if="symbols"
            v-on:click="reset_all"
            class="p-1 border-2 border-red-400"
          >
            Reset
          </button>
        </div>
        <video id="videoElement" muted autoplay playsinline></video>
      </div>
    </div>
    <script src="lib/vue.global.prod.js"></script>
    <script src="lib/zbar-wasm.js"></script>
    <script src="lib/pako.min.js"></script>
    <script src="lib/fountain.js"></script>
    <script>
      const { createApp, ref, reactive, computed, onMounted } = Vue;

      createApp({
        setup() {
          const idle_message = "Click Start Receiver, then point at the sender";
          const user_message = ref(idle_message);
          const solved = ref(0);
          const symbols = ref(0);
          const file_metadata = reactive({});
          const is_receiving = ref(false);
          let decoder = null;
          let current_id = null;
          let early = []; // frames caught before the meta frame
          let canvas, context, videoElement, audio_context;

          const percent = computed(() =>
            file_metadata.K
              ? Math.min(100, Math.round((solved.value / file_metadata.K) * 100))
              : 0
          );

          // ---- persistence (IndexedDB for frames, localStorage for meta) ----
          let db = null;
          const db_open = () =>
            new Promise((resolve) => {
              try {
                const req = indexedDB.open("qr_transfer", 1);
                req.onupgradeneeded = () =>
                  req.result.createObjectStore("chunks");
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
              } catch (e) {
                resolve(null);
              }
            });
          const db_put = (key, value) => {
            if (!db) return;
            try {
              db.transaction("chunks", "readwrite")
                .objectStore("chunks")
                .put(value, key);
            } catch (e) {}
          };
          const prefix_range = (id) =>
            IDBKeyRange.bound(id + ":", id + ":￿");
          const db_load = (id) =>
            new Promise((resolve) => {
              const out = new Map();
              if (!db) return resolve(out);
              try {
                const req = db
                  .transaction("chunks")
                  .objectStore("chunks")
                  .openCursor(prefix_range(id));
                req.onsuccess = () => {
                  const cursor = req.result;
                  if (cursor) {
                    out.set(parseInt(cursor.key.split(":")[1]), cursor.value);
                    cursor.continue();
                  } else {
                    resolve(out);
                  }
                };
                req.onerror = () => resolve(out);
              } catch (e) {
                resolve(out);
              }
            });
          const db_clear = (id) => {
            if (!db) return;
            try {
              db.transaction("chunks", "readwrite")
                .objectStore("chunks")
                .delete(prefix_range(id));
            } catch (e) {}
          };
          const save_meta = (meta) => {
            try {
              localStorage.setItem("qr_last_meta", JSON.stringify(meta));
            } catch (e) {}
          };
          const clear_meta = () => {
            try {
              localStorage.removeItem("qr_last_meta");
            } catch (e) {}
          };

          const beep = () => {
            try {
              audio_context = audio_context || new AudioContext();
              const osc = audio_context.createOscillator();
              osc.connect(audio_context.destination);
              osc.frequency.value = 880;
              osc.start();
              osc.stop(audio_context.currentTime + 0.25);
            } catch (e) {}
          };

          const b64_to_bytes = (b64) => {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
          };

          const reset_state = () => {
            decoder = null;
            current_id = null;
            early = [];
            solved.value = 0;
            symbols.value = 0;
            for (const key of Object.keys(file_metadata)) {
              delete file_metadata[key];
            }
          };

          const download_file = (data, fileName) => {
            const blob = new Blob([data]);
            const dummy_element = document.createElement("a");
            const url = URL.createObjectURL(blob);
            dummy_element.href = url;
            dummy_element.download = fileName;
            dummy_element.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
          };

          // Pause: keep everything (it is saved), just stop scanning.
          const stop_receiver = () => {
            is_receiving.value = false;
            user_message.value = "Paused - progress saved. Press Resume later.";
          };

          const reset_all = () => {
            is_receiving.value = false;
            if (current_id) db_clear(current_id);
            clear_meta();
            reset_state();
            user_message.value = idle_message;
          };

          const next_frame = () =>
            new Promise((r) =>
              "requestVideoFrameCallback" in videoElement
                ? videoElement.requestVideoFrameCallback(() => r())
                : requestAnimationFrame(() => r())
            );

          const add_symbol = (seed, bytes, persist) => {
            if (!decoder.add(seed, bytes)) return;
            if (persist) db_put(current_id + ":" + seed, bytes);
            symbols.value++;
            solved.value = decoder.solved;
          };

          const open_transfer = async (meta) => {
            current_id = meta.id;
            decoder = new Fountain.Decoder(meta.K, meta.B, Fountain.idhash(meta.id));
            symbols.value = 0;
            solved.value = 0;
            for (const [seed, bytes] of await db_load(meta.id)) {
              add_symbol(seed, bytes, false);
            }
            for (const frame of early) {
              if (frame.id === meta.id) add_symbol(frame.seed, frame.bytes, true);
            }
            early = [];
          };

          const handle_symbol = async (text) => {
            if (text.charAt(0) === "{") {
              const meta = JSON.parse(text);
              // The same meta repeating must NOT wipe what we already have.
              if (meta.id !== current_id || !decoder) {
                await open_transfer(meta);
                save_meta(meta);
              }
              Object.assign(file_metadata, meta);
              if (is_receiving.value) {
                user_message.value = `Receiving: ${meta.name}`;
              }
              return;
            }
            const parts = text.split("|");
            if (parts.length !== 3) return;
            const [id, seed, b64] = parts;
            const bytes = b64_to_bytes(b64);
            if (!decoder) {
              if (early.length < 5000) early.push({ id, seed: parseInt(seed), bytes });
              return;
            }
            if (id !== current_id) return;
            add_symbol(parseInt(seed), bytes, true);
          };

          const is_complete = () => decoder && decoder.complete;

          const finish = async () => {
            user_message.value = "Decoding file ...";
            try {
              const joined = decoder.result(file_metadata.len);
              let output;
              if (file_metadata.comp === "br") {
                const brotli = await import("./lib/brotli/brotli_wasm.js");
                await brotli.default();
                output = brotli.decompress(joined);
              } else {
                output = pako.inflate(joined);
              }
              download_file(output, file_metadata.name);
              user_message.value = "Data Transfer Complete";
              beep();
              db_clear(current_id);
              clear_meta();
              is_receiving.value = false;
              reset_state();
            } catch (error) {
              console.error(error);
              user_message.value =
                "Data is corrupted. Press Reset and scan again.";
              is_receiving.value = false;
            }
          };

          const start_camera = async () => {
            if (videoElement.srcObject) return true;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              user_message.value =
                "This browser cannot use the camera. Open the link in Safari (not inside Zalo) over https.";
              return false;
            }
            try {
              videoElement.srcObject = await navigator.mediaDevices.getUserMedia({
                video: {
                  facingMode: "environment",
                  width: { ideal: 1920 },
                  height: { ideal: 1080 },
                },
              });
              await videoElement.play();
              return true;
            } catch (error) {
              console.error(error);
              user_message.value = `Camera error: ${error.name}. Allow camera access (or open in Safari, not in Zalo) and try again.`;
              return false;
            }
          };

          const start_receiver = async () => {
            user_message.value = "Starting camera ...";
            if (!(await start_camera())) return;
            is_receiving.value = true;
            try {
              audio_context = audio_context || new AudioContext(); // unlock on click
            } catch (e) {}
            user_message.value = symbols.value
              ? "Resumed - point the camera at the sender's screen"
              : "Point the camera at the sender's screen";
            while (is_receiving.value && !is_complete()) {
              try {
                await next_frame();
                if (
                  canvas.width !== videoElement.videoWidth ||
                  canvas.height !== videoElement.videoHeight
                ) {
                  canvas.width = videoElement.videoWidth;
                  canvas.height = videoElement.videoHeight;
                }
                if (!canvas.width) continue;
                context.drawImage(videoElement, 0, 0);
                const image_data = context.getImageData(
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );
                const found = await zbarWasm.scanImageData(image_data);
                if (!found || !found.length) continue;
                await handle_symbol(found[0].decode());
              } catch (error) {
                console.error("Error in Loop: ", error);
              }
            }
            if (is_receiving.value && is_complete()) await finish();
          };

          onMounted(async () => {
            console.log("Application Initialized ...");
            videoElement = document.getElementById("videoElement");
            canvas = document.createElement("canvas");
            context = canvas.getContext("2d", { willReadFrequently: true });
            db = await db_open();
            // Restore an interrupted transfer
            try {
              const saved = JSON.parse(localStorage.getItem("qr_last_meta"));
              if (saved && saved.id && saved.K) {
                await open_transfer(saved);
                Object.assign(file_metadata, saved);
                if (symbols.value) {
                  user_message.value = `Saved progress found for ${saved.name}. Press Resume.`;
                }
              }
            } catch (e) {}
          });

          return {
            user_message,
            start_receiver,
            is_receiving,
            file_metadata,
            solved,
            symbols,
            percent,
            stop_receiver,
            reset_all,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
