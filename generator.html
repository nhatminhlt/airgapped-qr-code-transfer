<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      #qrcode img,
      #qrcode canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Sender Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>
        <div class="w-1/2 mb-4">
          <input
            class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none"
            id="file_input"
            type="file"
          />
        </div>
        <div class="text-sm mb-4">
          Speed:
          <select v-model.number="fps" class="border border-gray-500">
            <option :value="5">5 frames/s (safest)</option>
            <option :value="8">8 frames/s</option>
            <option :value="10">10 frames/s</option>
            <option :value="15">15 frames/s</option>
            <option :value="20">20 frames/s (fastest)</option>
          </select>
        </div>
        <button
          v-if="!is_transferring"
          v-on:click="start_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Transfer
        </button>
        <button
          v-else
          v-on:click="stop_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Transfer
        </button>
        <div id="qrcode" class=""></div>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const idle_message = "Choose file to get started";
          const user_message = ref(idle_message);
          const is_transferring = ref(false);
          const fps = ref(10);
          // Raw bytes per QR. Base64 grows it by 4/3, so ~536 chars at level L.
          const chunk_size = 400;
          const meta_every = 100;
          let qrcode_object = "";

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          // Base64 straight from the bytes (no UTF-8 round trip, which
          // inflated every byte >= 128 into two bytes).
          const bytes_to_b64 = (bytes) => {
            let binary = "";
            for (let i = 0; i < bytes.length; i += 0x8000) {
              binary += String.fromCharCode.apply(
                null,
                bytes.subarray(i, i + 0x8000)
              );
            }
            return btoa(binary);
          };

          const shuffled = (n) => {
            const order = Array.from({ length: n }, (_, i) => i);
            for (let i = n - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [order[i], order[j]] = [order[j], order[i]];
            }
            return order;
          };

          const show_qr = (text) => {
            qrcode_object.clear();
            qrcode_object.makeCode(text);
          };

          const stop_transfer = () => {
            is_transferring.value = false;
          };

          const start_transfer = async () => {
            const file = document.getElementById("file_input").files[0];
            if (!file) {
              user_message.value = "Please choose a file first";
              return;
            }
            is_transferring.value = true;
            user_message.value = "Compressing file ...";
            await sleep(20);

            const data_array = pako.gzip(
              new Uint8Array(await file.arrayBuffer()),
              { level: 9 }
            );
            const total_chunks = Math.ceil(data_array.length / chunk_size);
            const transfer_id = Math.random().toString(36).slice(2, 6);
            const meta_text = JSON.stringify({
              id: transfer_id,
              name: file.name,
              chunks: total_chunks,
            });
            // Pre-encode every frame once: id|index|base64
            const frames = new Array(total_chunks);
            for (let i = 0; i < total_chunks; i++) {
              const start = i * chunk_size;
              frames[i] =
                transfer_id +
                "|" +
                i +
                "|" +
                bytes_to_b64(data_array.subarray(start, start + chunk_size));
            }

            show_qr(meta_text);
            user_message.value = "Starting data transfer in few seconds ...";
            await sleep(1500);

            // Loop until stopped: a chunk the camera missed comes around
            // again. After the first pass the order is shuffled so a chunk is
            // not stuck in the same phase as the camera frame rate.
            let cycle = 0;
            while (is_transferring.value) {
              const order =
                cycle === 0
                  ? Array.from({ length: total_chunks }, (_, i) => i)
                  : shuffled(total_chunks);
              for (let k = 0; k < order.length; k++) {
                if (!is_transferring.value) break;
                if (k % meta_every === 0) {
                  show_qr(meta_text);
                  await sleep(1000 / fps.value);
                }
                show_qr(frames[order[k]]);
                user_message.value = `Pass ${cycle + 1}: chunk ${
                  k + 1
                }/${total_chunks} (press Stop when receiver is done)`;
                await sleep(1000 / fps.value);
              }
              cycle++;
            }

            show_qr(idle_message);
            user_message.value = idle_message;
          };

          onMounted(() => {
            console.log("Application Initialized ...");
            let lowest_size =
              Math.min(window.innerWidth, window.innerHeight) / 1.2;
            qrcode_object = new QRCode("qrcode", {
              text: idle_message,
              width: lowest_size,
              height: lowest_size,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L,
            });
          });

          return {
            user_message,
            start_transfer,
            stop_transfer,
            is_transferring,
            fps,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
