<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="lib/tailwind.js"></script>
    <style>
      #qrcode img,
      #qrcode canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="flex flex-row items-start w-full p-2 gap-3">
        <div class="flex flex-col shrink-0" style="width: 240px">
          <div class="text-base mb-1">Data Sender Mode</div>
          <div class="text-xs mb-3">{{user_message}}</div>
          <input
            class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none mb-3"
            id="file_input"
            type="file"
          />
          <div class="text-sm mb-3">
            Speed:
            <select v-model.number="fps" class="border border-gray-500">
              <option :value="5">5 frames/s (safest)</option>
              <option :value="8">8 frames/s</option>
              <option :value="10">10 frames/s</option>
              <option :value="15">15 frames/s</option>
              <option :value="20">20 frames/s (fastest)</option>
            </select>
          </div>
          <div class="text-sm mb-3">
            Batch (200 chunks each, 0 = all):
            <div class="flex flex-row items-center gap-1 mt-1">
              <button class="px-2 border-2 border-gray-500" v-on:click="prev_batch">
                &#9664;
              </button>
              <input
                type="number"
                min="0"
                v-model.number="batch"
                class="w-16 border border-gray-500 text-center"
              />
              <button class="px-2 border-2 border-gray-500" v-on:click="next_batch">
                &#9654;
              </button>
              <span v-if="total_batches">/ {{total_batches}}</span>
            </div>
          </div>
          <button
            v-if="!is_transferring"
            v-on:click="start_transfer"
            class="p-1 border-2 border-gray-500"
          >
            Start Transfer
          </button>
          <button
            v-else
            v-on:click="stop_transfer"
            class="p-1 border-2 border-gray-500"
          >
            Stop Transfer
          </button>
        </div>
        <div id="qrcode"></div>
      </div>
    </div>
    <script src="lib/vue.global.prod.js"></script>
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/pako.min.js"></script>
    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const idle_message = "Choose file to get started";
          const user_message = ref(idle_message);
          const is_transferring = ref(false);
          const fps = ref(10);
          const batch = ref(0); // 0 = loop all chunks, n = only batch n (1-based)
          const total_batches = ref(0);
          // Raw bytes per QR. Base64 grows it by 4/3, so ~536 chars at level L.
          const chunk_size = 400;
          const batch_size = 200;
          const meta_every = 50;
          let qrcode_object = "";

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          const crc_table = (() => {
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
              let c = n;
              for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
              t[n] = c >>> 0;
            }
            return t;
          })();
          const crc32 = (bytes) => {
            let c = 0xffffffff;
            for (let i = 0; i < bytes.length; i++) {
              c = crc_table[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
            }
            return (c ^ 0xffffffff) >>> 0;
          };

          // Base64 straight from the bytes (no UTF-8 round trip, which
          // inflated every byte >= 128 into two bytes).
          const bytes_to_b64 = (bytes) => {
            let binary = "";
            for (let i = 0; i < bytes.length; i += 0x8000) {
              binary += String.fromCharCode.apply(
                null,
                bytes.subarray(i, i + 0x8000)
              );
            }
            return btoa(binary);
          };

          const shuffled = (n) => {
            const order = Array.from({ length: n }, (_, i) => i);
            for (let i = n - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [order[i], order[j]] = [order[j], order[i]];
            }
            return order;
          };

          const show_qr = (text) => {
            qrcode_object.clear();
            qrcode_object.makeCode(text);
          };

          const clamp_batch = () => {
            const b = Math.floor(Number(batch.value)) || 0;
            const max = total_batches.value || Infinity;
            return Math.min(Math.max(b, 0), max);
          };
          const prev_batch = () => {
            batch.value = Math.max(clamp_batch() - 1, 0);
          };
          const next_batch = () => {
            batch.value = clamp_batch() + 1;
            batch.value = clamp_batch();
          };

          const stop_transfer = () => {
            is_transferring.value = false;
          };

          const start_transfer = async () => {
            const file = document.getElementById("file_input").files[0];
            if (!file) {
              user_message.value = "Please choose a file first";
              return;
            }
            is_transferring.value = true;
            user_message.value = "Compressing file ...";
            await sleep(20);

            const data_array = pako.gzip(
              new Uint8Array(await file.arrayBuffer()),
              { level: 9 }
            );
            const total_chunks = Math.ceil(data_array.length / chunk_size);
            total_batches.value = Math.ceil(total_chunks / batch_size);
            // Same file => same id, so the receiver can resume after a break.
            const transfer_id = crc32(data_array).toString(36);
            const meta_text = JSON.stringify({
              id: transfer_id,
              name: file.name,
              chunks: total_chunks,
              batch: batch_size,
            });
            // Pre-encode every frame once: id|index|base64
            const frames = new Array(total_chunks);
            for (let i = 0; i < total_chunks; i++) {
              const start = i * chunk_size;
              frames[i] =
                transfer_id +
                "|" +
                i +
                "|" +
                bytes_to_b64(data_array.subarray(start, start + chunk_size));
            }
            batch.value = clamp_batch();

            show_qr(meta_text);
            user_message.value = "Starting data transfer in few seconds ...";
            await sleep(1500);

            // Loop the selected batch until stopped (or the batch is
            // changed): a chunk the camera missed comes around again. After
            // the first pass the order is shuffled so a chunk is not stuck in
            // the same phase as the camera frame rate.
            let cycle = 0;
            let active = -1;
            while (is_transferring.value) {
              const b = clamp_batch();
              if (b !== active) {
                active = b;
                cycle = 0;
              }
              const from = b === 0 ? 0 : (b - 1) * batch_size;
              const to =
                b === 0 ? total_chunks : Math.min(b * batch_size, total_chunks);
              const count = to - from;
              const order =
                cycle === 0
                  ? Array.from({ length: count }, (_, i) => i)
                  : shuffled(count);
              for (let k = 0; k < count; k++) {
                if (!is_transferring.value || clamp_batch() !== active) break;
                if (k % meta_every === 0) {
                  show_qr(meta_text);
                  await sleep(1000 / fps.value);
                }
                show_qr(frames[from + order[k]]);
                user_message.value = `${
                  b === 0 ? "All" : `Batch ${b}/${total_batches.value}`
                } · pass ${cycle + 1} · chunk ${k + 1}/${count}`;
                await sleep(1000 / fps.value);
              }
              cycle++;
            }

            show_qr(idle_message);
            user_message.value = idle_message;
          };

          onMounted(() => {
            console.log("Application Initialized ...");
            let lowest_size =
              Math.min(window.innerWidth - 280, window.innerHeight - 24);
            qrcode_object = new QRCode("qrcode", {
              text: idle_message,
              width: lowest_size,
              height: lowest_size,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L,
            });
          });

          return {
            user_message,
            start_transfer,
            stop_transfer,
            is_transferring,
            fps,
            batch,
            total_batches,
            prev_batch,
            next_batch,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
