<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="lib/tailwind.js"></script>
    <style>
      #qrcode img,
      #qrcode canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="flex flex-row items-start w-full p-2 gap-3">
        <div class="flex flex-col shrink-0" style="width: 240px">
          <div class="text-base mb-1">Data Sender Mode</div>
          <div class="text-xs mb-3">{{user_message}}</div>
          <input
            class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none mb-3"
            id="file_input"
            type="file"
          />
          <div class="text-sm mb-3">
            Speed:
            <select v-model.number="fps" class="border border-gray-500">
              <option :value="5">5 frames/s (safest)</option>
              <option :value="8">8 frames/s</option>
              <option :value="10">10 frames/s</option>
              <option :value="12">12 frames/s</option>
              <option :value="15">15 frames/s</option>
              <option :value="20">20 frames/s (fastest)</option>
            </select>
          </div>
          <div class="text-sm mb-3">
            Bytes per QR:
            <select v-model.number="block_size" class="border border-gray-500">
              <option :value="300">300 (easiest to scan)</option>
              <option :value="400">400</option>
              <option :value="600">600</option>
              <option :value="800">800 (densest)</option>
            </select>
          </div>
          <div class="text-sm mb-3">
            Compression:
            <select v-model.number="quality" class="border border-gray-500">
              <option :value="9">Fast (~3s, ~10% smaller than gzip)</option>
              <option :value="11">Max (~40s, page freezes, ~20% smaller)</option>
            </select>
          </div>
          <label class="text-sm mb-3 block">
            <input type="checkbox" v-model="repair_only" />
            Resume: send repair frames only (receiver kept its progress)
          </label>
          <button
            v-if="!is_transferring"
            v-on:click="start_transfer"
            class="p-1 border-2 border-gray-500"
          >
            Start Transfer
          </button>
          <button
            v-else
            v-on:click="stop_transfer"
            class="p-1 border-2 border-gray-500"
          >
            Stop Transfer
          </button>
        </div>
        <div id="qrcode"></div>
      </div>
    </div>
    <script src="lib/vue.global.prod.js"></script>
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/pako.min.js"></script>
    <script src="lib/fountain.js"></script>
    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const idle_message = "Choose file to get started";
          const user_message = ref(idle_message);
          const is_transferring = ref(false);
          const fps = ref(10);
          const block_size = ref(400);
          const repair_only = ref(false);
          const quality = ref(9);
          const meta_every = 50;
          let qrcode_object = "";

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          const crc_table = (() => {
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
              let c = n;
              for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
              t[n] = c >>> 0;
            }
            return t;
          })();
          const crc32 = (bytes) => {
            let c = 0xffffffff;
            for (let i = 0; i < bytes.length; i++) {
              c = crc_table[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
            }
            return (c ^ 0xffffffff) >>> 0;
          };

          const bytes_to_b64 = (bytes) => {
            let binary = "";
            for (let i = 0; i < bytes.length; i += 0x8000) {
              binary += String.fromCharCode.apply(
                null,
                bytes.subarray(i, i + 0x8000)
              );
            }
            return btoa(binary);
          };

          // Brotli (wasm, bundled in lib/) with gzip as a fallback.
          const compress = async (input, level) => {
            try {
              const brotli = await import("./lib/brotli/brotli_wasm.js");
              await brotli.default();
              return { comp: "br", data: brotli.compress(input, { quality: level }) };
            } catch (error) {
              console.error("Brotli unavailable, using gzip", error);
              return { comp: "gz", data: pako.gzip(input, { level: 9 }) };
            }
          };

          const show_qr = (text) => {
            qrcode_object.clear();
            qrcode_object.makeCode(text);
          };

          const stop_transfer = () => {
            is_transferring.value = false;
          };

          const start_transfer = async () => {
            const file = document.getElementById("file_input").files[0];
            if (!file) {
              user_message.value = "Please choose a file first";
              return;
            }
            is_transferring.value = true;
            user_message.value =
              quality.value >= 11
                ? "Compressing (Max): the page will look frozen for ~40s, please wait ..."
                : "Compressing ...";
            await sleep(50);

            const original = new Uint8Array(await file.arrayBuffer());
            const { comp, data } = await compress(original, quality.value);
            const B = block_size.value;
            const K = Math.ceil(data.length / B);
            const padded = new Uint8Array(K * B);
            padded.set(data);
            // Same file => same id, so the receiver can resume after a break.
            const transfer_id = crc32(data).toString(36);
            const idh = Fountain.idhash(transfer_id);
            const meta_text = JSON.stringify({
              id: transfer_id,
              name: file.name,
              len: data.length,
              K,
              B,
              comp,
            });
            const kb = (n) => Math.round(n / 1024);
            const info = `${kb(original.length)}KB -> ${kb(data.length)}KB (${comp}), ${K} blocks`;

            show_qr(meta_text);
            user_message.value = `${info}. Starting in few seconds ...`;
            await sleep(1500);

            // Endless stream: seeds 0..K-1 are the plain blocks, everything
            // after is a repair symbol. The receiver needs about K symbols in
            // total, whichever ones it manages to catch.
            let seed = repair_only.value ? K + Math.floor(Math.random() * 1e6) : 0;
            let sent = 0;
            while (is_transferring.value) {
              if (sent % meta_every === 0) {
                show_qr(meta_text);
                await sleep(1000 / fps.value);
              }
              const symbol = Fountain.encode(padded, K, B, idh, seed);
              show_qr(transfer_id + "|" + seed + "|" + bytes_to_b64(symbol));
              sent++;
              seed++;
              user_message.value = `${info} · frame ${sent} (${Math.round(
                (sent / K) * 100
              )}% of ${K}) - press Stop when the receiver is done`;
              await sleep(1000 / fps.value);
            }

            show_qr(idle_message);
            user_message.value = idle_message;
          };

          onMounted(() => {
            console.log("Application Initialized ...");
            let lowest_size =
              Math.min(window.innerWidth - 280, window.innerHeight - 24);
            qrcode_object = new QRCode("qrcode", {
              text: idle_message,
              width: lowest_size,
              height: lowest_size,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.L,
            });
          });

          return {
            user_message,
            start_transfer,
            stop_transfer,
            is_transferring,
            fps,
            block_size,
            repair_only,
            quality,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
